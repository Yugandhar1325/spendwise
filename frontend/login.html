<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | SpendWise</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

    <nav class="navbar">

        <div class="logo">
            SpendWise
        </div>

        <div class="nav-links">

            <a href="index.html">Home</a>

            <a href="register.html">Register</a>

        </div>

    </nav>

</header>

<main class="auth-section">

<div class="auth-container">

    <!-- Left Side -->

    <div class="auth-info">

        <h1>

            Welcome
            <span>Back!</span>

        </h1>

        <p>

            Login to manage your expenses,
            budgets and savings from one place.

        </p>

        <div class="auth-benefits">

            <div>💰 Track every expense</div>

            <div>📊 View spending reports</div>

            <div>🎯 Stay within your budget</div>

            <div>📈 Grow your savings</div>

        </div>

    </div>


    <!-- Login Form -->

    <div class="auth-form-container">

        <h2>Login</h2>

        <p class="form-subtitle">

            Welcome back to SpendWise

        </p>

        <form id="loginForm">

            <div class="form-group">

                <label>Email</label>

                <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
                required>

            </div>

            <div class="form-group">

                <label>Password</label>

                <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                required>

            </div>

            <button
            type="submit"
            class="auth-button">

                Login

            </button>

        </form>

        <p class="auth-switch">

            Don't have an account?

            <a href="register.html">

                Register

            </a>

        </p>

    </div>

</div>

</main>

<script src="js/script.js"></script>

</body>
</html>
